{% extends "base.html" %}

<!-- Formulario para crear una nueva cobertura o editar una existente. -->

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 m-0">Registrar Nueva Cobertura Médica</h2>
                </div>
                <div class="card-body">
                    <form>
                        <!-- Nombre de la cobertura -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Oficial / Razón Social</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej: Medicus SA" required>
                            <div class="form-text">Ingrese el nombre completo de la entidad de salud.</div>
                        </div>

                        <!-- Sigla o detalle de planes -->
                        <div class="mb-3">
                            <label for="sigla" class="form-label fw-semibold">Sigla o Identificador Corto</label>
                            <input type="text" class="form-control" id="sigla" placeholder="Ej: MEDICUS" required>
                        </div>

                        <!-- Estado inicial -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold d-block">Estado de Alta</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="estado" id="activo" value="true"
                                    checked>
                                <label class="form-check-input-label text-success" for="activo">Activa (Disponible para
                                    pacientes)</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="estado" id="inactivo" value="false">
                                <label class="form-check-input-label text-danger" for="inactivo">Inactiva (Deshabilitada
                                    temporalmente)</label>
                            </div>
                        </div>

                        <!-- Botones de acción organizados con Bootstrap -->
                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="/coberturas" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Cobertura</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
