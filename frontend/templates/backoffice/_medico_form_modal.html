
<div class="modal fade"
     id="medico-modal"
     tabindex="-1"
     aria-labelledby="medico-modal-titulo"
     aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">

        <form class="modal-content"
              action="{{ url_for('backoffice.crear_medico') }}"
              method="post"
              id="medico-form">

            <div class="modal-header">
                <h2 class="modal-title fs-5" id="medico-modal-titulo">
                    Nuevo médico
                </h2>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                </button>
            </div>

            <div class="modal-body">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-matricula">
                            Matrícula *
                        </label>

                        <input class="form-control"
                               id="medico-matricula"
                               name="matricula"
                               type="text"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-especialidad">
                            Especialidad *
                        </label>

                        <select class="form-select"
                                id="medico-especialidad"
                                name="especialidad_id"
                                required>
                            <option value="">Seleccionar…</option>

                            {% for especialidad in especialidades %}
                                <option value="{{ especialidad.id }}">
                                    {{ especialidad.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-nombre">
                            Nombre *
                        </label>

                        <input class="form-control"
                               id="medico-nombre"
                               name="nombre"
                               type="text"
                               maxlength="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-apellido">
                            Apellido *
                        </label>

                        <input class="form-control"
                               id="medico-apellido"
                               name="apellido"
                               type="text"
                               maxlength="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-email">
                            Email *
                        </label>

                        <input class="form-control"
                               id="medico-email"
                               name="email"
                               type="email"
                               maxlength="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-medium"
                               for="medico-telefono">
                            Teléfono
                        </label>

                        <input class="form-control"
                               id="medico-telefono"
                               name="telefono"
                               type="tel">
                    </div>

                    <div class="col-md-6" data-solo-alta>
                        <label class="form-label small fw-medium"
                               for="medico-password">
                            Contraseña inicial *
                        </label>

                        <input class="form-control"
                               id="medico-password"
                               name="password"
                               type="password"
                               minlength="8"
                               maxlength="128"
                               autocomplete="new-password"
                               required>

                        <div class="form-text">
                            Entre 8 y 128 caracteres.
                        </div>
                    </div>

                    <div class="col-12">
                        <span class="form-label small fw-medium d-block">
                            Coberturas aceptadas
                        </span>

                        {% for cobertura in coberturas %}
                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       id="medico-cobertura-{{ cobertura.id }}"
                                       name="coberturas"
                                       type="checkbox"
                                       value="{{ cobertura.id }}">

                                <label class="form-check-label"
                                       for="medico-cobertura-{{ cobertura.id }}">
                                    {{ cobertura.nombre }}
                                </label>
                            </div>
                        {% else %}
                            <p class="text-body-secondary small">
                                No hay coberturas disponibles.
                            </p>
                        {% endfor %}
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="button button-outline button-small"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="submit"
                        class="button button-primary button-small">
                    Guardar
                </button>
            </div>

        </form>
    </div>
</div>
