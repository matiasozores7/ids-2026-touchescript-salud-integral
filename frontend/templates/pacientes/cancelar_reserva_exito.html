{% extends "base.html" %}

{% block title %}Turno cancelado · Salud Integral{% endblock %}

{% block content %}
<section class="py-5 mx-auto" style="max-width: 620px">
  <div class="card border-0 shadow-sm p-4 p-md-5 text-center">
    <i class="bi bi-check-circle text-success fs-1" aria-hidden="true"></i>
    <h1 class="h3 fw-bold mt-3">Turno cancelado</h1>
    <p class="text-body-secondary">
      La reserva se canceló correctamente y el horario quedó liberado.
    </p>
    <a class="button button-primary button-large mt-2" href="{{ inicio_url }}">
      Ir al inicio
    </a>
  </div>
</section>
{% endblock %}
