
{# estado: reservado | confirmado | atendido | cancelado | ausente #}
{% macro estado_pill(estado) %}
  <span class="badge rounded-pill estado estado-{{ estado }}">{{ estado|capitalize }}</span>
{% endmacro %}

{% macro icono_qr() %}
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v2M14 20h2M20 19v2"/></svg>
{% endmacro %}

{% macro volver(url, texto) %}
  <a class="d-inline-flex align-items-center gap-2 mb-3 small fw-medium text-body-secondary" href="{{ url }}">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    {{ texto }}
  </a>
{% endmacro %}
