
{% extends "pacientes/reserva/_base.html" %}

{% set paso_actual = 2 %}

{% block paso %}

<div class="row row-cols-1 row-cols-lg-2 g-3">
  {% for m in medicos %}
    <div class="col">
      <a class="reserva-card card flex-row align-items-center gap-3 p-3"
         href="{{ url_for('patient.reservar_fecha_hora', medico_id=m.id) }}">

        <span class="avatar avatar-icono" aria-hidden="true">
          {{ m.nombre[0] }}{{ m.apellido[0] }}
        </span>

        <div>
          <h2 class="text-lg mb-0">
            {{ m.nombre }} {{ m.apellido }}
          </h2>

          <p class="small text-body-secondary mb-0">
            {{ m.especialidad }}
          </p>
        </div>
      </a>
    </div>
  {% else %}
    <div class="col-12">
      <p class="text-body-secondary">
        No hay médicos disponibles para esta especialidad.
      </p>
    </div>
  {% endfor %}
</div>

{% endblock %}
