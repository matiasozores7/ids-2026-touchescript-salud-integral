
{% extends "pacientes/reserva/_base.html" %}

{% set paso_actual = 1 %}

{% block paso %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
  {% for e in especialidades %}
    <div class="col">
      <a class="reserva-card card h-100 p-3"
         href="{{ url_for('patient.reservar_medico', especialidad_id=e.id) }}">

        <span class="avatar avatar-icono rounded-3 fs-5 mb-3"
              aria-hidden="true">
          <i class="bi bi-clipboard2-pulse"></i>
        </span>

        <h2 class="text-lg mb-0">{{ e.nombre }}</h2>
      </a>
    </div>
  {% else %}
    <div class="col-12">
      <p class="text-body-secondary">
        No hay especialidades disponibles actualmente.
      </p>
    </div>
  {% endfor %}
</div>

{% endblock %}
