
services:
  mysql:
    image: mysql:8.4
    container_name: salud-mysql
    env_file:
      - .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: salud-backend
    env_file:
      - .env
    environment:
      PORT: "5000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-123}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5001}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: salud-frontend
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:5000/api
      FRONTEND_PORT: "5001"
    ports:
      - "5001:5001"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: salud-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"


volumes:
  mysql_data:
